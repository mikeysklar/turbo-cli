[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adafruit-turbo"
version = "0.1.0"
description = "Compile @turbo-marked CircuitPython modules to native .mpy with the official mpy-cross"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.scripts]
turbo = "turbo_cli:main"

[tool.setuptools]
package-dir = { "" = "cli" }
py-modules = ["turbo_cli", "turbo_repl"]
packages = ["turbo_assets"]

[tool.setuptools.package-data]
turbo_assets = ["shim/*.py", "examples/mandelbrot/*.py", "examples/mandelbrot/src/*.py"]
